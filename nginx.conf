# ============================================================================
# SalesVisualization — Nginx 反代示例（公开版，无真实证书路径 / IP / 域名）
# 仅展示拓扑：三域名 HTTPS → 后端 127.0.0.1:8900，HTTP 跳转 HTTPS。
# 部署时自行填入证书路径与真实域名；切勿提交真实私钥路径。
# ============================================================================

# 三个子域共用同一后端（示例用 example.com 占位）
#   sales.example.com  -> 销售可视化 Web
#   study.example.com  -> 学习/文档
#   work.example.com   -> 工作留痕

server {
    listen 80;
    server_name sales.example.com study.example.com work.example.com;
    # HTTP 兼容跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sales.example.com;

    # 部署时替换为你的证书路径（本示例不含真实路径）
    ssl_certificate     /etc/nginx/ssl/example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/example.com/privkey.pem;

    # 后端仅本机监听，由 Nginx 反代
    location / {
        proxy_pass http://127.0.0.1:8900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 桌面端自动更新 feed
    location /download/ {
        alias /var/www/sales-desktop/;
    }
}

# study / work 子域同理，分别反代到各自本地端口（示例 3700 / 3400）
